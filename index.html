<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Dex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0514;
    --panel: #18122c;
    --panel2: #221a3f;
    --border: #3a2d63;
    --accent: #ff8c00;
    --accent2: #ff5fa2;
    --accent3: #7c3aed;
    --text: #f1eefc;
    --muted: #a79fc9;
    --common: #9aa0a8;
    --uncommon: #4caf50;
    --rare: #2196f3;
    --epic: #a259ff;
    --legendary: #ffd700;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    position: relative;
    overflow-x: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,140,0,0.18), transparent 45%),
      radial-gradient(circle at 10% 20%, rgba(124,58,237,0.20), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(255,95,162,0.14), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 40px);
    background-attachment: fixed;
  }

  .float-deco {
    position: fixed;
    font-size: 26px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-18px) rotate(6deg); }
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(24,18,44,0.65);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(8px);
  }

  .hamburger {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
  }

  .nav-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 90;
  }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }

  .nav-panel {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100%;
    background: var(--panel2);
    border-right: 1px solid var(--border);
    z-index: 100;
    transition: left 0.22s ease;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .nav-panel.open { left: 0; }

  .nav-panel .nav-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .nav-link:hover { background: var(--panel); }
  .nav-link.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a0f0a; }

  .nav-close {
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .hero {
    position: relative;
    text-align: center;
    padding: 56px 20px 30px;
    z-index: 1;
  }
  .hero h1 {
    font-family: 'Creepster', cursive;
    font-size: 58px;
    margin: 0;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #ff8c00, #ff5fa2 60%, #ffd700);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255,140,0,0.35);
  }
  .hero p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  .stat-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 24px auto 0;
    max-width: 900px;
  }

  .stat-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat-pill b { color: var(--text); font-size: 15px; }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 20px 60px;
    position: relative;
    z-index: 1;
  }

  section { display: none; }
  section.active { display: block; }

  .search-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .search-row input {
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    width: 260px;
    font-family: 'Poppins', sans-serif;
  }
  .search-row input::placeholder { color: var(--muted); }
  .search-row input:focus { outline: 2px solid var(--accent); }

  .search-row button {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a0f0a;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }

  .filters {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filters button {
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .filters button.active { color: #0d0b1a; background: var(--text); }

  .stats-line {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    border: 2px solid var(--border);
    position: relative;
    transition: transform 0.12s ease;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-3px); }

  .wrapper-foil {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background-image: repeating-linear-gradient(
      45deg,
      var(--wrap-color) 0px, var(--wrap-color) 6px,
      rgba(0,0,0,0.25) 6px, rgba(0,0,0,0.25) 12px
    );
  }
  .card.missing .wrapper-foil { opacity: 0.25; filter: grayscale(1); }

  .card.owned {
    background: linear-gradient(160deg, color-mix(in srgb, var(--wrap-color) 16%, var(--panel)), var(--panel) 65%);
  }
  .card.owned.Common    { border-color: var(--common); }
  .card.owned.Uncommon  { border-color: var(--uncommon); box-shadow: 0 0 10px rgba(76,175,80,0.35); }
  .card.owned.Rare      { border-color: var(--rare); box-shadow: 0 0 10px rgba(33,150,243,0.4); }
  .card.owned.Epic      { border-color: var(--epic); box-shadow: 0 0 12px rgba(162,89,255,0.5); }
  .card.owned.Legendary { border-color: var(--legendary); box-shadow: 0 0 16px rgba(255,215,0,0.6); }
  .card.missing { opacity: 0.32; filter: grayscale(1); }

  .card .emoji { font-size: 32px; }
  .card .name { font-size: 12px; margin-top: 6px; min-height: 32px; line-height: 1.25; }
  .card .rarity { font-size: 10px; text-transform: uppercase; opacity: 0.75; margin-top: 2px; letter-spacing: 0.5px; }

  .count {
    position: absolute;
    top: 6px;
    right: 8px;
    background: var(--accent);
    color: #1a0f0a;
    font-weight: 800;
    font-size: 10px;
    border-radius: 8px;
    padding: 2px 7px;
  }

  .lb-wrap {
    max-width: 800px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    padding: 14px 18px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  .rank { font-weight: 800; width: 50px; }
  .rank-1 { color: var(--legendary); }
  .rank-2 { color: #d9d9d9; }
  .rank-3 { color: #e0a569; }
  .name-cell { font-weight: 700; }
  .lb-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
</style>
</head>
<body>

<span class="float-deco" style="top:8%; left:6%;">🦇</span>
<span class="float-deco" style="top:20%; left:90%; animation-delay: 3s;">🎃</span>
<span class="float-deco" style="top:55%; left:3%; animation-delay: 6s;">🕸️</span>
<span class="float-deco" style="top:70%; left:94%; animation-delay: 2s;">👻</span>
<span class="float-deco" style="top:5%; left:50%; animation-delay: 4.5s;">🦇</span>

<div class="topbar">
  <button class="hamburger" id="hamburgerBtn">☰</button>
  <div class="brand">🎃 Candy Dex</div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<div class="nav-panel" id="navPanel">
  <button class="nav-close" id="navClose">✕</button>
  <div class="nav-title">Menu</div>
  <button class="nav-link active" id="navLinkMine">🍬 My Candy</button>
  <button class="nav-link" id="navLinkBoard">🏆 Leaderboard</button>
</div>

<div class="hero">
  <h1>Candy Dex</h1>
  <p>Collect, trade stories, and see how you stack up against the community</p>
  <div class="stat-bar">
    <div class="stat-pill"><b id="statTotalCandies">—</b> candies to collect</div>
    <div class="stat-pill"><b id="statLegendary">—</b> Legendary</div>
    <div class="stat-pill"><b id="statCommunityBags">—</b> community bags opened</div>
  </div>
</div>

<main>
  <section id="tabMine" class="active">
    <div class="search-row">
      <input id="usernameInput" type="text" placeholder="your Twitch username" />
      <button onclick="loadViewer(true)">Show my candy</button>
    </div>
    <div class="filters" id="rarityFilters"></div>
    <div class="stats-line" id="stats"></div>
    <div id="grid"></div>
  </section>

  <section id="tabBoard">
    <div class="lb-wrap">
      <table>
        <thead>
          <tr><th>Rank</th><th>Viewer</th><th>Candies</th><th>Legendary</th><th>Bags Opened</th></tr>
        </thead>
        <tbody id="lbBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const BASE = "./";
const USERNAME_KEY = "candydex_username";
let candies = [];
let viewers = {};
let activeRarity = "All";
const RARITIES = ["All", "Common", "Uncommon", "Rare", "Epic", "Legendary"];

async function loadData() {
  const [candyRes, viewerRes, communityRes] = await Promise.all([
    fetch(BASE + "candies.json", { cache: "no-store" }),
    fetch(BASE + "viewers.json", { cache: "no-store" }),
    fetch(BASE + "community.json", { cache: "no-store" }).catch(() => null)
  ]);
  candies = await candyRes.json();
  try { viewers = await viewerRes.json(); } catch (e) { viewers = {}; }

  document.getElementById("statTotalCandies").textContent = candies.length;
  document.getElementById("statLegendary").textContent =
    candies.filter(c => c.rarity === "Legendary").length;
  try {
    const communityText = communityRes ? (await communityRes.text()).trim() : "0";
    document.getElementById("statCommunityBags").textContent = parseInt(communityText, 10) || 0;
  } catch (e) {
    document.getElementById("statCommunityBags").textContent = "0";
  }
}

function buildFilters() {
  const wrap = document.getElementById("rarityFilters");
  wrap.innerHTML = "";
  RARITIES.forEach(r => {
    const btn = document.createElement("button");
    btn.textContent = r;
    if (r === activeRarity) btn.classList.add("active");
    btn.onclick = () => {
      activeRarity = r;
      buildFilters();
      renderGrid(currentOwnedMap);
    };
    wrap.appendChild(btn);
  });
}

let currentOwnedMap = {};

function renderGrid(ownedMap) {
  currentOwnedMap = ownedMap;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const list = activeRarity === "All" ? candies : candies.filter(c => c.rarity === activeRarity);
  list.forEach(c => {
    const owned = ownedMap[c.id] > 0;
    const div = document.createElement("div");
    div.className = "card " + (owned ? "owned " + c.rarity : "missing");
    if (c.wrapperColor) div.style.setProperty("--wrap-color", c.wrapperColor);
    div.innerHTML = `
      <div class="wrapper-foil"></div>
      <div class="emoji">${owned ? c.emoji : "❓"}</div>
      <div class="name">${owned ? c.name : "???"}</div>
      <div class="rarity">${owned ? c.rarity : ""}</div>
      ${owned ? `<div class="count">x${ownedMap[c.id]}</div>` : ""}
    `;
    grid.appendChild(div);
  });
}

function loadViewer(fromClick) {
  const name = document.getElementById("usernameInput").value.trim().toLowerCase();
  const stats = document.getElementById("stats");
  if (!name) return;

  try { localStorage.setItem(USERNAME_KEY, name); } catch (e) {}

  const data = viewers[name];
  const owned = data ? data.candies : {};
  const ownedCount = Object.keys(owned).length;
  const bags = data ? data.bagsOpened : 0;

  stats.textContent = `${name}: ${ownedCount} / ${candies.length} candies collected — ${bags} bags opened`;
  renderGrid(owned);
}

function renderLeaderboard() {
  const candyById = {};
  candies.forEach(c => { candyById[c.id] = c; });

  const rows = Object.keys(viewers).map(name => {
    const v = viewers[name];
    const ownedIds = Object.keys(v.candies || {});
    const uniqueCount = ownedIds.length;
    let legendaryCount = 0;
    ownedIds.forEach(id => {
      const c = candyById[id];
      if (c && c.rarity === "Legendary") legendaryCount += v.candies[id];
    });
    return { name, uniqueCount, legendaryCount, bagsOpened: v.bagsOpened || 0 };
  });

  rows.sort((a, b) => b.uniqueCount - a.uniqueCount || b.legendaryCount - a.legendaryCount || b.bagsOpened - a.bagsOpened);

  const tbody = document.getElementById("lbBody");
  tbody.innerHTML = "";

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="lb-empty">No bags opened yet — be the first!</td></tr>`;
    return;
  }

  const medals = ["🥇", "🥈", "🥉"];
  rows.slice(0, 25).forEach((r, i) => {
    const rankClass = i < 3 ? `rank-${i + 1}` : "";
    const rankDisplay = i < 3 ? medals[i] : `#${i + 1}`;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="rank ${rankClass}">${rankDisplay}</td>
      <td class="name-cell">${r.name}</td>
      <td>${r.uniqueCount} / ${candies.length}</td>
      <td>${r.legendaryCount}</td>
      <td>${r.bagsOpened}</td>
    `;
    tbody.appendChild(tr);
  });
}

function switchTab(which) {
  document.getElementById("tabMine").classList.toggle("active", which === "mine");
  document.getElementById("tabBoard").classList.toggle("active", which === "board");
  document.getElementById("navLinkMine").classList.toggle("active", which === "mine");
  document.getElementById("navLinkBoard").classList.toggle("active", which === "board");
  if (which === "board") renderLeaderboard();
  closeNav();
}

const navOverlay = document.getElementById("navOverlay");
const navPanel = document.getElementById("navPanel");

function openNav() {
  navOverlay.classList.add("open");
  navPanel.classList.add("open");
}
function closeNav() {
  navOverlay.classList.remove("open");
  navPanel.classList.remove("open");
}

document.getElementById("hamburgerBtn").onclick = openNav;
document.getElementById("navClose").onclick = closeNav;
navOverlay.onclick = closeNav;
document.getElementById("navLinkMine").onclick = () => switchTab("mine");
document.getElementById("navLinkBoard").onclick = () => switchTab("board");

(async () => {
  await loadData();
  buildFilters();

  let savedName = "";
  try { savedName = localStorage.getItem(USERNAME_KEY) || ""; } catch (e) {}

  if (savedName) {
    document.getElementById("usernameInput").value = savedName;
    loadViewer(false);
  } else {
    document.getElementById("stats").textContent = `Search your Twitch username above to see your collection.`;
    renderGrid({});
  }
})();
</script>

</body>
</html>
