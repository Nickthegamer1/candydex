<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Candy Pokedex</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #14102a;
    color: #fff;
    padding: 24px;
  }
  h1 { text-align: center; margin-bottom: 4px; }
  #sub { text-align: center; opacity: 0.7; margin-bottom: 20px; }
  #search {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  #search input {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    width: 220px;
  }
  #search button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: #ff8c00;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  #stats {
    text-align: center;
    margin-bottom: 20px;
    font-size: 15px;
    opacity: 0.9;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #221c44;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    border: 2px solid #3a3268;
    position: relative;
  }
  .card.owned.Common     { border-color: #cfcfcf; }
  .card.owned.Uncommon   { border-color: #4caf50; }
  .card.owned.Rare       { border-color: #2196f3; }
  .card.owned.Epic       { border-color: #9c27b0; }
  .card.owned.Legendary  { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .card.missing { opacity: 0.35; filter: grayscale(1); }
  .emoji { font-size: 30px; }
  .name { font-size: 12px; margin-top: 4px; min-height: 30px; }
  .rarity { font-size: 10px; text-transform: uppercase; opacity: 0.7; }
  .count {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #ff8c00;
    color: #221c44;
    font-weight: 800;
    font-size: 11px;
    border-radius: 8px;
    padding: 1px 6px;
  }
</style>
</head>
<body>

<h1>🍬 Candy Pokedex</h1>
<div id="sub">Type your username to see your own collection</div>

<div id="search">
  <input id="usernameInput" type="text" placeholder="your Twitch/Kick/YouTube username" />
  <button onclick="loadViewer()">Show my candy</button>
</div>

<div id="stats"></div>
<div id="grid"></div>

<script>
// This version reads candies.json / viewers.json sitting right next to this
// page (e.g. in the same GitHub repo), not from a local PC.
const BASE = "./";

let candies = [];
let viewers = {};

async function loadData() {
  const [candyRes, viewerRes] = await Promise.all([
    fetch(BASE + "candies.json", { cache: "no-store" }),
    fetch(BASE + "viewers.json", { cache: "no-store" })
  ]);
  candies = await candyRes.json();
  try {
    viewers = await viewerRes.json();
  } catch (e) {
    viewers = {};
  }
}

function renderGrid(ownedMap) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  candies.forEach(c => {
    const owned = ownedMap[c.id] > 0;
    const div = document.createElement("div");
    div.className = "card " + (owned ? "owned " + c.rarity : "missing");
    div.innerHTML = `
      <div class="emoji">${owned ? c.emoji : "❓"}</div>
      <div class="name">${owned ? c.name : "???"}</div>
      <div class="rarity">${owned ? c.rarity : ""}</div>
      ${owned ? `<div class="count">x${ownedMap[c.id]}</div>` : ""}
    `;
    grid.appendChild(div);
  });
}

function loadViewer() {
  const name = document.getElementById("usernameInput").value.trim().toLowerCase();
  const stats = document.getElementById("stats");
  if (!name) return;

  const data = viewers[name];
  const owned = data ? data.candies : {};
  const ownedCount = Object.keys(owned).length;
  const bags = data ? data.bagsOpened : 0;

  stats.textContent = `${name}: ${ownedCount} / ${candies.length} candies collected — ${bags} bags opened`;
  renderGrid(owned);
}

(async () => {
  await loadData();
  document.getElementById("stats").textContent =
    `${candies.length} candies exist this event. Search your name above to see your collection.`;
  renderGrid({}); // show full silhouette grid by default
})();
</script>

</body>
</html>
